<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Courtside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="g"></canvas>

<!-- In-game HUD -->
<div id="hud">
  <div id="card" class="pnl">
    <div id="pn">PLAYER</div>
    <div id="pp"></div>
    <div class="st">
      <span><i>PTS</i><b id="s1">0</b></span><span><i>REB</i><b id="s2">0</b></span>
      <span><i>AST</i><b id="s3">0</b></span><span><i>STL</i><b id="s4">0</b></span>
    </div>
  </div>
  <div id="sb" class="pnl">
    <div class="tm"><i id="hc"></i><b id="hn">HOME</b><b id="hs" class="sc">0</b></div>
    <div class="mid"><span id="qt">Q1</span><b id="clk">4:00</b><span>SHOT <b id="sck">24</b></span></div>
    <div class="tm"><b id="as" class="sc">0</b><b id="an">AWAY</b><i id="ac"></i></div>
  </div>
  <div id="meter" class="pnl"><div class="trk"><i id="nd"></i></div><div class="lb2"><span>EARLY</span><span>GOOD</span><span>LATE</span></div></div>
  <div id="vm"><div class="vt"><i class="vz"></i><i class="vf" id="vf"></i><i class="vn" id="vn"></i></div><b id="vl"></b></div>
  <div id="toast"></div>
</div>
<div id="ttl"></div><div id="lb1" class="lb"></div><div id="lb2" class="lb"></div>

<!-- Main menu -->
<div id="menu" class="scr on">
  <div class="menu-l">
    <div class="brand">COURT<em>SIDE</em></div>
    <p id="mt">Full-court 3-on-3. Drive to an open rim and the bucket is yours.</p>
    <nav>
      <button class="btn pri" id="bPlay">PLAY</button>
      <button class="btn" id="bPrac">PRACTICE</button>
      <button class="btn" id="bSet">SETTINGS</button>
    </nav>
  </div>
</div>

<!-- Setup: teams, mode, court, difficulty -->
<div id="setup" class="scr">
  <header class="su-top"><span>PLAY NOW</span><b>COURTSIDE</b><span>TEAM SELECT</span></header>
  <div class="su-main">
    <section class="side" id="sideA"></section>
    <section class="side r" id="sideB"></section>
    <div class="roster" id="roster"></div>
  </div>
  <footer class="su-bot">
    <div class="opt"><i>MODE</i><div class="seg" data-k="mode"><button data-v="mayhem">MAYHEM</button><button data-v="clean">CLEAN</button></div></div>
    <div class="opt"><i>COURT</i><div class="seg" data-k="court"><button data-v="arena">ARENA</button><button data-v="street">STREET</button></div></div>
    <div class="opt"><i>DIFFICULTY</i><div class="seg" data-k="diff"><button data-v="0">ROOKIE</button><button data-v="1">PRO</button><button data-v="2">ALL-STAR</button><button data-v="3">HALL OF FAMER</button></div></div>
    <div class="act"><button class="btn" id="bBack">BACK</button><button class="btn pri" id="bStart">START GAME</button></div>
  </footer>
</div>

<!-- Pause -->
<div id="pause" class="scr dim">
  <div class="pnl box">
    <h2>PAUSED</h2>
    <nav>
      <button class="btn pri" id="bRes">RESUME</button>
      <button class="btn" id="bPSet">SETTINGS</button>
      <button class="btn" id="bQuit">QUIT TO MENU</button>
    </nav>
  </div>
</div>

<!-- Settings: video, audio, gameplay, controls -->
<div id="sets" class="scr dim">
  <div class="pnl box">
    <h2>SETTINGS</h2>
    <div class="tabs" id="setTabs"></div>
    <div class="rows" id="setRows"></div>
    <button class="btn pri" id="bSetX">BACK</button>
  </div>
</div>

<script src="js/teams.js"></script>
<script src="js/settings.js"></script>
<script src="js/core.js"></script>
<script src="js/projection.js"></script>
<script src="js/arena.js"></script>
<script src="js/players.js"></script>
<script src="js/render.js"></script>
<script src="js/camera.js"></script>
<script src="js/gameplay.js"></script>
<script src="js/loop.js"></script>
<script src="js/audio.js"></script>
<script src="js/menus.js"></script>
<script src="js/main.js"></script>
</body>
</html>
